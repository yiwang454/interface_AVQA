BACKVERIFICATION_PROMPT1: |
  "You are a back-verification question generator for Audio-Visual Multiple-Choice QA.

  Goal:
  Given a question and multiple-choice options, write ONE short 'back-verify' question (one sentence) for EACH option.
  A back-verify question should:
  - Be answerable by re-checking the video/audio (or by plausible consequence-checking for inference options).
  - Prefer concrete evidence queries: time order (before/after), what is seen, what is heard, what is said.

  Output format (STRICT):
  Return a JSON object: {{'A': '...', 'B': '...', 'C': '...', 'D': '...'}}
  No extra text.

  --- In-context examples ---
  Example 1 (audio-visual alignment):
  Input:
  question: What happened visually before the narrator mentioned having a '13 mm on this hub'?
  options:
  D. A metallic part with studs was shown, and a loud noise was heard.
  Output:
  {{'A': '...', 'B': '...', 'C': '...', 'D':"What audio or speech event occurs immediately before the moment a metallic part with studs is shown and a loud noise is heard?"}}

  Example 2 (inference / purpose):
  Input:
  question: Considering the audio and visual cues, what is the likely purpose of the individuals handling the white wired headphones?
  options:
  B. They are preparing to listen to music.
  Output:
  {{'A': '...', 'B': 'If they are preparing to listen to music, what observable actions or audio/visual cues would you expect them to do or produce next?', 'C': '...', 'D': '...'}}
  Now do the task with:
  Question: {question}
  Options: {options}"

BACKVERIFICATION_PROMPT2: |
  "Given the original question Q1 and a candidate option O1, the Back Verification Question Q_BV is a dual question constructed by taking the key statement in O1 as a premise and then querying, in reverse, the core information targeted by Q1 (e.g., the corresponding visual detail, time point, or event). If O1 is true, the correct answer A_BV should be consistent with or equivalent to the key answer information in Q1, thereby supporting O1 as the correct option for Q1. 
  The above is the prompt to design back verification question. Now based on this, design Q_BV for each question and option pair. Requirements: - Break this down step by step (no more than 4 steps), before return the final result. - When formulating the query for Q_BV, use broad, categorical terms rather than highly specific phrases from Q1. - Return the final result in JSON format: {{"Q_BV": "..."}}
  Question: {question}
  Option: {options}"

BACKVERIFICATION_PROMPT3: |
  "You are an expert at logical reasoning and question design. Your task is to generate a Back Verification Question (Q_BV) given an original question (Q1) and a candidate option (O1).
  Concept: Every question has a "Premise" (the given context) and a "Target" (the missing information). Q1 uses a Premise to ask for a Target, and O1 is a candidate for that Target. Q_BV is a "dual question." To construct Q_BV, you must swap the knowns and unknowns: take the key statement in O1 as your new Premise, and query the original Premise of Q1.
  Requirements: Break this down into exactly 3 steps before returning the final result:
  1.Identify the Premise and Target of Q1.
  2.Treat O1 as the new Premise.
  3.Formulate the raw Q_BV by asking for the original Premise of Q1 based on O1. Use broad, categorical terms for the query rather than highly specific phrases from Q1.
  Return the final result in JSON format: {{"Q_BV": "..."}}
  Question: {question} 
  Option: {options}"

BACKVERIFICATION_REWRITE_OPTION: |
  "Question: {question}
  Option: {options}
  Your task is to rewrite each option with its question into a full sentence, which is a self-contained sentence that allows reader to understand without reading the question. Return a list of option sentences in JSON format: {{"options": ["A. ...", "B. ...", ...]}}"

