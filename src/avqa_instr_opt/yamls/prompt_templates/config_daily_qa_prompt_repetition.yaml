BV_DECISION_PROMPT: |
  "You are a verifier for an iterative video QA system. You are given the question Q1, current candidate answer O1, back verification question and answer. The Back Verification Question Q_BV is a dual question to Q1, constructed by taking the key statement in O1 as a premise and then querying, in reverse, the core information targeted by Q1 (e.g., the corresponding visual detail, time point, or event). If the answer A_BV is consistent with or equivalent to the key answer information in Q1, then O1 is true, ACCEPT. If the answer A_BV contradicts or differs from Q1, then O1 is false, ELIMINATE. If the answer A_BV is ambiguous/insufficient (neither clearly supports nor contradicts), then O1 is uncertain, RETRY.
  Decide the next step:
  1.ACCEPT. 
  2.ELIMINATE.
  3.RETRY: raise another back verification question.
  Original question Q1: {question}
  Current candidate answer O1: {options}
  Back-verification question Q_BV: {back_verify_question}
  Back-verification answer A_BV: {back_verify_answer}
  Return JSON as final answer:
  {{"action": "accept|eliminate|retry", "eliminate_option": "A|B|C|D|null", "retry_question": "..."}}"

BV_DECISION_PROMPT_ALL_OPTIONS: |
  "You are a verifier for a multiple-choice video QA system.
  You are given the original question Q1 and, for each option, its candidate answer, back-verification question, and back-verification answer.
  For each option O, the Back Verification Question (Q_BV) is a dual question to Q1: it is constructed by taking the key statement in O as a premise and then querying, in reverse, the core information in Q1 (such as the relevant visual detail, time point, or event). If the Back Verification Answer (A_BV) is consistent with or equivalent to the key information in Q1, this supports that option. If A_BV contradicts or fails to match the key information asked in Q1, this weakens that option.
  Your task is to compare all four options, and select the option whose back-verification result most strongly and directly matches the key information in Q1.
  Question Q1: {question}
  Option, back verification question and answer: {options}
  Think step by step, and return a capital letter representing your choice: A, B, C, or D."