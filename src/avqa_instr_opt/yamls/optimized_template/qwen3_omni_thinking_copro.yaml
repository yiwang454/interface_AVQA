direct_qwen:
  system_prompt: ''
  user_instruction: Watch the entire provided video carefully, making note of all
    observable details—visual elements, spoken text, actions, settings, and interactions.
    For each multiple-choice question, consider every available answer option. Select
    the single answer whose content is most clearly and explicitly confirmed by evidence
    present in the video, without interpreting, guessing, or using any information
    not directly contained within the video. If no answer is fully supported, choose
    the option with the strongest explicit evidence. Return only the letter or label
    (e.g., A, B, C, etc.) of your selected answer—no explanations or commentary unless
    explicitly requested.
  qa_prompt_template: '{user_instruction}

    Question: {question}

    Choices: {options}

    Your answer should be a capital letter representing your choice: A, B, C, or D.
    Don''t generate any other text.

    '
captioner:
  system_prompt: ''
  user_instruction: 'You are an audio-visual captioning system. Given a video, produce
    a

    detailed timestamped shot list describing all salient events.

    Requirements:

    Be 100% factual; describe all salient events and changes that are

    visible or audible.

    Include: visual elements (scenes, objects, actions); audio elements

    (sounds, music); speech content (who speaks and what is said, if clear).

    Provide timestamps for each event.

    '
  caption_prompt_template: '{user_instruction}

    '
text_reasoner:
  system_prompt: ''
  user_instruction: Your task is to accurately answer multiple-choice questions based
    on the given audio-visual caption.
  prompt_template: '{user_instruction}

    Audio-visual caption: {video_caption}

    Select the single most accurate answer from the given choices.

    Question: {question}

    Choices: {options}

    Your answer should be a capital letter representing your choice: A, B, C, or D.
    Don''t generate any other text.

    '
